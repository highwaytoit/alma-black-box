---
name: Build Alma Black Box minimal-plus testing image

on:
  workflow_dispatch:

concurrency:
  group: alma-black-box-minimal-plus-testing
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/alma-black-box
  CURRENT_REFERENCE_TAG: '10'
  TEST_TAG: '10-minimal-plus-testing'
  ALMA_REPOS_IMAGE: quay.io/almalinuxorg/10-base:10
  BOOTC_IMAGECTL_IMAGE: quay.io/centos-bootc/centos-bootc:stream10
  ALMA_BUILDER_IMAGE: quay.io/almalinuxorg/10-kitten-base:10-kitten

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Require testing branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/testing" ]]; then
            echo "This workflow is intentionally restricted to the testing branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Resolve minimal-plus build inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail

          resolve_ref() {
            local image="$1"
            local digest
            digest="$(skopeo inspect \
              --override-arch amd64 \
              --format '{{.Digest}}' \
              "docker://${image}")"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s@%s' "${image%:*}" "${digest}"
          }

          repos_ref="$(resolve_ref "${ALMA_REPOS_IMAGE}")"
          imagectl_ref="$(resolve_ref "${BOOTC_IMAGECTL_IMAGE}")"
          builder_ref="$(resolve_ref "${ALMA_BUILDER_IMAGE}")"

          echo "Alma repository image: ${repos_ref}"
          echo "bootc imagectl image: ${imagectl_ref}"
          echo "Alma builder image: ${builder_ref}"

          echo "repos_ref=${repos_ref}" >> "${GITHUB_OUTPUT}"
          echo "imagectl_ref=${imagectl_ref}" >> "${GITHUB_OUTPUT}"
          echo "builder_ref=${builder_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build minimal-plus image
        shell: bash
        env:
          ALMA_REPOS_REF: ${{ steps.inputs.outputs.repos_ref }}
          BOOTC_IMAGECTL_REF: ${{ steps.inputs.outputs.imagectl_ref }}
          ALMA_BUILDER_REF: ${{ steps.inputs.outputs.builder_ref }}
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "ALMA_REPOS_IMAGE=${ALMA_REPOS_REF}" \
            --build-arg "BOOTC_IMAGECTL_IMAGE=${BOOTC_IMAGECTL_REF}" \
            --build-arg "ALMA_BUILDER_IMAGE=${ALMA_BUILDER_REF}" \
            --build-arg "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag alma-black-box:minimal-plus-test \
            --file Containerfile \
            .

      - name: Validate completed image
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --entrypoint /bin/bash \
            alma-black-box:minimal-plus-test \
            -c '
              set -euo pipefail

              check_file() {
                if [[ ! -f "$1" ]]; then
                  echo "ERROR: expected file missing: $1" >&2
                  exit 1
                fi
              }

              bootc container lint --fatal-warnings
              rpm -q \
                fwupd-efi \
                qemu-guest-agent \
                nut \
                nut-client \
                selinux-policy-extra \
                smartmontools-selinux \
                cockpit-system \
                cockpit-files \
                cockpit-podman \
                cockpit-storaged
              command -v tailscale
              command -v netbird
              command -v fwupdmgr
              command -v smartctl
              command -v micro
              semodule -l >/dev/null
              check_file /usr/share/cockpit/upside/manifest.json
              check_file /usr/share/alma-black-box/quadlets/cockpit.container
              check_file /usr/share/alma-black-box/doc/README.md
              check_file /usr/lib/pki/containers/highwaytoit.pub
              check_file /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
              check_file /etc/systemd/zram-generator.conf
              jq empty /etc/containers/policy.json
              grep -Fq "ghcr.io/highwaytoit/alma-black-box:" /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
              grep -Fq "use-sigstore-attachments: true" /etc/containers/registries.d/ghcr.io-highwaytoit.yaml
            '

      - name: Compare with current standard-based image
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          standard_ref="${IMAGE_REPOSITORY}:${CURRENT_REFERENCE_TAG}"
          sudo podman pull "${standard_ref}"

          sudo podman run --rm --entrypoint rpm \
            alma-black-box:minimal-plus-test \
            -qa --qf '%{NAME}\n' | sort -u > /tmp/minimal-plus-packages.txt

          sudo podman run --rm --entrypoint rpm \
            "${standard_ref}" \
            -qa --qf '%{NAME}\n' | sort -u > /tmp/standard-packages.txt

          candidate_count="$(wc -l < /tmp/minimal-plus-packages.txt)"
          standard_count="$(wc -l < /tmp/standard-packages.txt)"

          candidate_size="$(sudo podman image inspect alma-black-box:minimal-plus-test --format '{{.Size}}')"
          standard_size="$(sudo podman image inspect "${standard_ref}" --format '{{.Size}}')"

          candidate_rpm_bytes="$(sudo podman run --rm --entrypoint /bin/bash \
            alma-black-box:minimal-plus-test \
            -c "rpm -qa --qf '%{SIZE}\\n' | awk '{s+=\$1} END {print s+0}'")"
          standard_rpm_bytes="$(sudo podman run --rm --entrypoint /bin/bash \
            "${standard_ref}" \
            -c "rpm -qa --qf '%{SIZE}\\n' | awk '{s+=\$1} END {print s+0}'")"

          echo "Minimal-plus RPM count: ${candidate_count}"
          echo "Standard-based RPM count: ${standard_count}"
          echo "Minimal-plus local image size: ${candidate_size} bytes"
          echo "Standard-based local image size: ${standard_size} bytes"
          echo "Minimal-plus RPM payload: ${candidate_rpm_bytes} bytes"
          echo "Standard-based RPM payload: ${standard_rpm_bytes} bytes"

          echo
          echo '=== Packages present only in current standard-based image ==='
          comm -23 /tmp/standard-packages.txt /tmp/minimal-plus-packages.txt || true

          echo
          echo '=== Packages present only in minimal-plus candidate ==='
          comm -13 /tmp/standard-packages.txt /tmp/minimal-plus-packages.txt || true

          echo "candidate_count=${candidate_count}" >> "${GITHUB_OUTPUT}"
          echo "standard_count=${standard_count}" >> "${GITHUB_OUTPUT}"
          echo "candidate_size=${candidate_size}" >> "${GITHUB_OUTPUT}"
          echo "standard_size=${standard_size}" >> "${GITHUB_OUTPUT}"
          echo "candidate_rpm_bytes=${candidate_rpm_bytes}" >> "${GITHUB_OUTPUT}"
          echo "standard_rpm_bytes=${standard_rpm_bytes}" >> "${GITHUB_OUTPUT}"

      - name: Prepare testing tags
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          build_tag="${TEST_TAG}-$(date -u +%Y%m%d)-${short_sha}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"
          echo "Publishing ${IMAGE_REPOSITORY}:${TEST_TAG} and ${IMAGE_REPOSITORY}:${build_tag}"

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Push testing image
        id: push
        shell: bash
        run: |
          set -euo pipefail

          sudo podman tag alma-black-box:minimal-plus-test "${IMAGE_REPOSITORY}:${BUILD_TAG}"
          sudo podman tag alma-black-box:minimal-plus-test "${IMAGE_REPOSITORY}:${TEST_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${BUILD_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${TEST_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Published testing digest: ${digest}"

      - name: Sign testing image digest
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Verify testing signature
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          REPOS_REF: ${{ steps.inputs.outputs.repos_ref }}
          IMAGECTL_REF: ${{ steps.inputs.outputs.imagectl_ref }}
          BUILDER_REF: ${{ steps.inputs.outputs.builder_ref }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          CANDIDATE_COUNT: ${{ steps.compare.outputs.candidate_count }}
          STANDARD_COUNT: ${{ steps.compare.outputs.standard_count }}
          CANDIDATE_SIZE: ${{ steps.compare.outputs.candidate_size }}
          STANDARD_SIZE: ${{ steps.compare.outputs.standard_size }}
          CANDIDATE_RPM_BYTES: ${{ steps.compare.outputs.candidate_rpm_bytes }}
          STANDARD_RPM_BYTES: ${{ steps.compare.outputs.standard_rpm_bytes }}
        run: |
          {
            echo '## Alma Black Box minimal-plus testing build'
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Test image: ${IMAGE_REPOSITORY}:${TEST_TAG}"
            echo "- Published digest: ${PUBLISHED_DIGEST:-not published}"
            echo "- Alma repository source: ${REPOS_REF:-unknown}"
            echo "- bootc imagectl source: ${IMAGECTL_REF:-unknown}"
            echo "- Alma builder source: ${BUILDER_REF:-unknown}"
            echo
            echo '### Comparison with current :10 image'
            echo
            echo "- RPM count: minimal-plus ${CANDIDATE_COUNT:-n/a}; standard-based ${STANDARD_COUNT:-n/a}"
            echo "- Local image size: minimal-plus ${CANDIDATE_SIZE:-n/a} bytes; standard-based ${STANDARD_SIZE:-n/a} bytes"
            echo "- Installed RPM payload: minimal-plus ${CANDIDATE_RPM_BYTES:-n/a} bytes; standard-based ${STANDARD_RPM_BYTES:-n/a} bytes"
          } >> "${GITHUB_STEP_SUMMARY}"
