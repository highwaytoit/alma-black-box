global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

remote_write:
  - url: http://victoriametrics:8428/api/v1/write

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
