name = "alma-black-box-installer"
description = "Unattended UEFI installer for Alma Black Box"
version = "1"

# This installer is intentionally destructive. It is designed for a VM with
# one blank disk and for the physical Black Box with every non-target disk
# disconnected before booting the ISO.
[customizations.installer.kickstart]
contents = """
text --non-interactive
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
timezone America/Toronto --utc
network --bootproto=dhcp --device=link --activate --onboot=on --hostname=alma-black-box

zerombr
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=512
part /boot --fstype=xfs --size=1024
part / --fstype=xfs --grow --size=8192

rootpw --lock --plaintext bbox
user --name=bbox --groups=wheel --password=bbox --plaintext

reboot --eject
"""
