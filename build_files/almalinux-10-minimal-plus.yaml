releasever: 10

repos:
  - baseos
  - appstream

variables:
  distro: "almalinux10"

# Build from the bootc minimal-plus content tier rather than the generic
# headless-server standard tier used by AlmaLinux's published bootc image.
# Keep selected standard behavior fragments that are useful for a physical or
# virtual monitoring appliance, without inheriting the full standard package set.
include:
  - minimal-plus/manifest.yaml
  - standard/autoupdates.yaml
  - standard/system-configuration.yaml
  - standard/persistent-journal.yaml
  - standard/generic-growfs.yaml

packages:
  - almalinux-repos

postprocess:
  - |
    #!/usr/bin/env bash
    set -euo pipefail

    mkdir -p /usr/lib/bootc/install/
    cat > /usr/lib/bootc/install/20-rhel.toml << EOF
    [install]
    root-fs-type = "xfs"
    EOF
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    # AlmaLinux bootc package does not yet ship the bootc dracut module
    # expected by newer bootc-base manifests. Match AlmaLinux's official
    # bootc image workaround until that package gains the module.
    DRACUT_CONF="/usr/lib/dracut/dracut.conf.d/20-bootc-base.conf"
    if [ -f "${DRACUT_CONF}" ]; then
      sed -i 's/ bootc / /' "${DRACUT_CONF}"
    fi
  - |
    #!/usr/bin/env bash
    set -euo pipefail
    dnf clean all
    rm /var/{log,cache,lib}/* -rf
    systemctl preset-all
